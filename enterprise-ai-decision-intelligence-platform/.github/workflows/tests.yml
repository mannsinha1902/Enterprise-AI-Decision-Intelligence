name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: decision_intelligence
          POSTGRES_USER: decision_app
          POSTGRES_PASSWORD: ci_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decision_app -d decision_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://decision_app:ci_local_password@127.0.0.1:5432/decision_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check changed Python surfaces
        run: >-
          python -m ruff check --select E4,E7,E9,F
          app.py src/api/main.py src/api/service.py src/database/monitoring.py
          src/monitoring.py src/monitoring_cli.py tests/test_monitoring.py
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src tests train.py app.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci_local_password
          DATABASE_URL: postgresql+psycopg://decision_app:ci_local_password@postgres:5432/decision_intelligence
      - name: Prepare PostgreSQL schema
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://decision_app:ci_local_password@127.0.0.1:5432/decision_intelligence
      - run: python -m pytest -q
