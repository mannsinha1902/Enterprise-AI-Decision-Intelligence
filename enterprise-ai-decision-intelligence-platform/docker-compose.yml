services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decision_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-decision_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PERSIST_PREDICTIONS: ${PERSIST_PREDICTIONS:-true}
      MONITORING_PSI_WARNING_THRESHOLD: ${MONITORING_PSI_WARNING_THRESHOLD:-0.1}
      MONITORING_PSI_CRITICAL_THRESHOLD: ${MONITORING_PSI_CRITICAL_THRESHOLD:-0.2}
      MONITORING_CATEGORICAL_WARNING_THRESHOLD: ${MONITORING_CATEGORICAL_WARNING_THRESHOLD:-0.1}
      MONITORING_CATEGORICAL_CRITICAL_THRESHOLD: ${MONITORING_CATEGORICAL_CRITICAL_THRESHOLD:-0.2}
      MONITORING_MIN_SAMPLES: ${MONITORING_MIN_SAMPLES:-30}
      MONITORING_PERFORMANCE_WARNING_DROP_THRESHOLD: ${MONITORING_PERFORMANCE_WARNING_DROP_THRESHOLD:-0.1}
      MONITORING_PERFORMANCE_CRITICAL_DROP_THRESHOLD: ${MONITORING_PERFORMANCE_CRITICAL_DROP_THRESHOLD:-0.2}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MONITORING_API_URL: http://api:8000
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
